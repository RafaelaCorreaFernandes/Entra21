<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="cadastro.css">
  <title>Cadastro de Clientes</title>
</head>

<body>
  <nav class="menu">
    <button class="menu-btn" onclick="irPara('cadastro')">Cadastro</button>
    <button class="menu-btn" onclick="irPara('clientes')">Agenda</button>
  </nav>

  <div id="cadastro" class="page active">
    <h1>Cadastro de Clientes</h1>
    <div class="container-cadastro">
      <div class="cadastro">
        <label>Nome:</label>
        <input type="text" id="nome" placeholder="Seu nome">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Seu e-mail">
        <label>Telefone:</label>
        <input type="tel" id="telefone" placeholder="Seu telefone">
        <button class="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>
        <p id="aviso" class="aviso"></p>
      </div>
    </div>
  </div>

  <div id="clientes" class="page">
    <h1>Clientes Cadastrados</h1>
    <div id="container-clientes" class="container-clientes">
      <p class="empty">Nenhum cliente cadastrado ainda.</p>
    </div>

      <nav class="retorno">
    <button class="btn-retorno" onclick="irPara('cadastro')"> Voltar para cadastro</button>
   </nav>

  </div>

   
  

  <script src="cadastro.js"></script>
</body>

</html>
