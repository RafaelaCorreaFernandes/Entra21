
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f4ff; }
  nav.menu { display: flex; gap: 16px; background: #1a4fba; padding: 16px 24px; }
  .menu-btn { color: #1a4fba; background: #fff; text-decoration: none; font-size: 15px; font-weight: bold; padding: 10px 28px; border-radius: 6px; cursor: pointer; border: none; transition: background 0.2s; }
  .menu-btn:hover { background: #e0e8ff; }
  .page { display: none; padding: 32px 24px; }
  .page.active { display: block; }
  h1 { color: #1a4fba; font-size: 22px; margin-bottom: 20px; border-left: 4px solid #1a4fba; padding-left: 12px; }
  .container-cadastro { background: #fff; border: 1px solid #c5d5f5; border-radius: 10px; padding: 28px; max-width: 480px; }
  .cadastro { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 13px; font-weight: bold; color: #1a4fba; }
  input { padding: 10px 14px; border: 1px solid #c5d5f5; border-radius: 6px; font-size: 14px; outline: none; }
  input:focus { border-color: #1a4fba; }
  .btn-cadastrar { margin-top: 10px; padding: 12px; background: #1a4fba; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-cadastrar:hover { background: #1340a0; }
  .container-clientes { background: #fff; border: 1px solid #c5d5f5; border-radius: 10px; overflow: hidden; max-width: 700px; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #1a4fba; color: #fff; }
  th { padding: 12px 16px; text-align: left; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  td { padding: 12px 16px; font-size: 14px; border-bottom: 1px solid #e8eeff; }
  tbody tr:hover { background: #f0f4ff; }
  tbody tr:last-child td { border-bottom: none; }
  .empty { text-align: center; color: #888; padding: 24px; font-size: 14px; }
</style>

<nav class="menu">
  <button class="menu-btn" onclick="irPara('cadastro')">Cadastro</button>
  <button class="menu-btn" onclick="irPara('clientes')">Agenda</button>
</nav>

<div id="cadastro" class="page active">
  <h1>Cadastro de Clientes</h1>
  <div class="container-cadastro">
    <div class="cadastro">
      <label>Nome:</label>
      <input type="text" id="nome" placeholder="Seu nome">
      <label>Email:</label>
      <input type="email" id="email" placeholder="Seu e-mail">
      <label>Telefone:</label>
      <input type="tel" id="telefone" placeholder="Seu telefone">
      <button class="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>
    </div>
  </div>
</div>

<div id="clientes" class="page">
  <h1>Lista de Clientes</h1>
  <div class="container-clientes">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Telefone</th>
        </tr>
      </thead>
      <tbody id="tabela-body">
        <tr><td colspan="3" class="empty">Nenhum cliente cadastrado ainda.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function irPara(pagina) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
    document.getElementById(pagina).classList.add('active')
  }

  function cadastrar() {
    const nome = document.getElementById('nome').value.trim()
    const email = document.getElementById('email').value.trim()
    const telefone = document.getElementById('telefone').value.trim()

    if (!nome || !email || !telefone) {
      alert('Preencha todos os campos!')
      return
    }

    const tbody = document.getElementById('tabela-body')
    const vazio = tbody.querySelector('.empty')
    if (vazio) vazio.parentElement.remove()

    const tr = document.createElement('tr')
    tr.innerHTML = `<td>${nome}</td><td>${email}</td><td>${telefone}</td>`
    tbody.appendChild(tr)

    document.getElementById('nome').value = ''
    document.getElementById('email').value = ''
    document.getElementById('telefone').value = ''

    irPara('clientes')
  }
</script>
